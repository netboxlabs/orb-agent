name: Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build & Scan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    env:
      TRIVY_DISABLE_VEX_NOTICE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Extract Go version from go.mod
        run: echo "GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}' | cut -d. -f1,2)" >> $GITHUB_ENV

      - name: Set build info
        run: |
          echo ${GITHUB_SHA::7} > ./agent/version/BUILD_COMMIT.txt
          # Latest AGENT release only: list the agent's v* tags directly. Backend
          # releases are tagged <backend>/v* and are excluded by the refs/tags/v*
          # pattern; ls-remote avoids release-API pagination and works at any clone depth.
          LATEST_RELEASE=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "${LATEST_RELEASE:-develop}" > ./agent/version/BUILD_VERSION.txt
          # Backend versions (latest <backend>/v* tag) — stamped into the from-source build.
          nd=$(git ls-remote --tags --refs origin 'refs/tags/network-discovery/v*' | sed 's#.*/v##' | sort -V | tail -1)
          sd=$(git ls-remote --tags --refs origin 'refs/tags/snmp-discovery/v*' | sed 's#.*/v##' | sort -V | tail -1)
          dd=$(git ls-remote --tags --refs origin 'refs/tags/device-discovery/v*' | sed 's#.*/v##' | sort -V | tail -1)
          wk=$(git ls-remote --tags --refs origin 'refs/tags/worker/v*' | sed 's#.*/v##' | sort -V | tail -1)
          {
            echo "BUILD_COMMIT_SHORT=${GITHUB_SHA::7}"
            echo "ND_VERSION=${nd:-0.0.0}"
            echo "SD_VERSION=${sd:-0.0.0}"
            echo "DD_VERSION=${dd:-0.0.0}"
            echo "WK_VERSION=${wk:-0.0.0}"
          } >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: agent/docker/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,scope=linux/amd64,mode=max
          no-cache-filters: python-builder,final
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            BUILD_COMMIT=${{ env.BUILD_COMMIT_SHORT }}
            BUILD_TRACK=develop
            NETWORK_DISCOVERY_VERSION=${{ env.ND_VERSION }}
            SNMP_DISCOVERY_VERSION=${{ env.SD_VERSION }}
            DEVICE_DISCOVERY_VERSION=${{ env.DD_VERSION }}
            WORKER_VERSION=${{ env.WK_VERSION }}
          tags: orb-agent:scan

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: orb-agent:scan
          format: json
          output: trivy-output.json
          vuln-type: os,library
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: "0"
          list-all-pkgs: "true"

      - name: Build scan summary
        id: scan-summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('trivy-output.json', 'utf8'));
            const vulns = (data.Results || []).flatMap(r =>
              (r.Vulnerabilities || []).map(v => ({ ...v, target: r.Target }))
            );

            const blockingSeverities = new Set(['CRITICAL', 'HIGH']);

            const SEVERITY_LABEL = {
              CRITICAL: '🔴 **CRITICAL**',
              HIGH: '🟠 **HIGH**',
              MEDIUM: '🟡 MEDIUM',
              LOW: '⚪ LOW'
            };

            const counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
            for (const v of vulns) {
              if (counts[v.Severity] !== undefined) counts[v.Severity]++;
            }

            const hasBlocking = vulns.some(v => blockingSeverities.has(v.Severity));
            core.setOutput('has_blocking', hasBlocking.toString());

            const buildTable = (vulns) => {
              if (vulns.length === 0) return '_No vulnerabilities found._\n';
              let t = '| Source | Library | CVE | Severity | Installed | Fixed | Title |\n';
              t += '|---|---|---|---|---|---|---|\n';
              for (const v of vulns) {
                const title = (v.Title || '').replace(/\|/g, '\\|').substring(0, 80);
                const cve = v.PrimaryURL ? `[${v.VulnerabilityID}](${v.PrimaryURL})` : v.VulnerabilityID;
                const source = (v.target || '').replace(/\|/g, '\\|');
                t += `| ${source} | ${v.PkgName} | ${cve} | ${SEVERITY_LABEL[v.Severity] || v.Severity} | ${v.InstalledVersion} | ${v.FixedVersion || 'N/A'} | ${title} |\n`;
              }
              return t;
            };

            const table = buildTable(vulns);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Vulnerability Scan Results\n\n' + table
            );

            // Store table for PR comment step
            const artifact = JSON.stringify({ table, hasBlocking, counts });
            fs.writeFileSync('scan-result.json', artifact);

      - name: Post scan results as PR comment
        continue-on-error: true  # Fork PRs have read-only tokens and cannot post comments
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const { table, hasBlocking } = JSON.parse(fs.readFileSync('scan-result.json', 'utf8'));

            const heading = hasBlocking
              ? '## Vulnerability Scan: Failed — blocking vulnerabilities detected'
              : '## Vulnerability Scan: Passed';

            const commitSha = process.env.COMMIT_SHA;
            const marker = '<!-- trivy-scan-results -->';
            const body = `${marker}\n${heading}\n\n**Image:** \`orb-agent:scan\`\n\n${table}\n*Commit: ${commitSha}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on blocking vulnerabilities
        if: steps.scan-summary.outputs.has_blocking == 'true'
        run: |
          echo "Blocking vulnerabilities found (CRITICAL or HIGH). Failing build."
          exit 1

      - name: Convert scan results to SBOM
        if: "!cancelled()"
        run: trivy convert --format cyclonedx --output sbom.cdx.json trivy-output.json

      - name: Upload SBOM artifact
        if: "!cancelled()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Convert scan results to SARIF
        if: "!cancelled()"
        run: trivy convert --format sarif --output trivy-results.sarif trivy-output.json

      - name: Upload SARIF to GitHub Code Scanning
        if: "!cancelled()"
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          sarif_file: trivy-results.sarif
