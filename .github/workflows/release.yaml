name: Orb Agent - release
on:
  workflow_dispatch:
  push:
    branches: [ release ]
    paths:
      # Agent releases fire only on agent-scoped changes (or the manual
      # workflow_dispatch above). Backend-only changes under orb-discovery/**
      # deliberately do NOT cut a new agent version — they ship via the
      # continuously-rebuilt develop image and are folded into the next agent
      # release notes (which aggregate every commit since the last vX.Y.Z tag).
      - "agent/**"
      - "cmd/**"
      - "!agent/docker/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SEMANTIC_RELEASE_PACKAGE: ${{ github.repository }}
  APP_NAME: orb-agent

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  get-next-version:
    name: Semantic release get next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Write package.json
        run: |
          cat > ./package.json <<'EOF'
          {
            "name": "${{ env.APP_NAME }}",
            "version": "1.0.0",
            "devDependencies": {
              "semantic-release-export-data": "^1.0.1",
              "semantic-release": "25.0.0-beta.6",
              "@semantic-release/changelog": "^6.0.3"
            }
          }
          EOF
      - name: Write .releaserc.json
        run: |
          cat > ./.releaserc.json <<'EOF'
          {
            "branches": "release",
            "repositoryUrl": "https://github.com/netboxlabs/orb-agent",
            "debug": "true",
            "tagFormat": "v${version}",
            "plugins": [
              ["semantic-release-export-data"],
              ["@semantic-release/commit-analyzer", {
                "releaseRules": [
                  { "message": "*", "release": "patch"},
                  { "message": "fix*", "release": "patch" },
                  { "message": "feat*", "release": "minor" },
                  { "message": "major*",  "release": "major" }
                ]
              }],
              "@semantic-release/release-notes-generator",
              [
                "@semantic-release/changelog",
                {
                  "changelogFile": "CHANGELOG.md",
                  "changelogTitle": "# Semantic Versioning Changelog"
                }
              ],
              [
                "@semantic-release/github",
                {
                  "assets": [
                    {
                      "path": "release/**"
                    }
                  ]
                }
              ]
            ]
          }
          EOF
      - name: setup semantic-release
        run: npm install --legacy-peer-deps
      - name: release dry-run
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_SEMANTIC_RELEASE_WEBHOOK }}
        run: npx semantic-release --debug --dry-run
        id: get-next-version
      - name: Set short sha output
        id: short-sha
        run: echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set release version
        id: release-version
        run: |
          echo "release-version=$(echo '${{ steps.get-next-version.outputs.new-release-version }}' | sed 's/v//g')" >> "$GITHUB_OUTPUT"
    outputs:
      new-release-published: ${{ steps.get-next-version.outputs.new-release-published }}
      new-release-version: ${{ steps.release-version.outputs.release-version }}
      short-sha: ${{ steps.short-sha.outputs.short-sha }}

  confirm-version:
    name: Next version ${{ needs.get-next-version.outputs.new-release-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: get-next-version
    if: needs.get-next-version.outputs.new-release-published == 'true'
    steps:
      - uses: actions/checkout@v6
      - run: echo "The new release version is ${{ needs.get-next-version.outputs.new-release-version }} commit ${{ needs.get-next-version.outputs.short-sha }}"

  build:
    name: Build (${{ matrix.platform }})
    needs: get-next-version
    runs-on: ${{ matrix.runner }}
    if: needs.get-next-version.outputs.new-release-published == 'true'
    permissions:
      contents: read
      packages: write
    env:
      BUILD_VERSION: ${{ needs.get-next-version.outputs.new-release-version }}
      BUILD_COMMIT: ${{ needs.get-next-version.outputs.short-sha }}
      REGISTRY: docker.io
      IMAGE_NAME: netboxlabs/orb-agent
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-2vcpu-ubuntu-2404
          - platform: linux/arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Go version from go.mod
        run: echo "GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}' | cut -d. -f1,2)" >> $GITHUB_ENV

      - name: Set build info
        run: |
          echo $BUILD_COMMIT > ./agent/version/BUILD_COMMIT.txt
          echo $BUILD_VERSION > ./agent/version/BUILD_VERSION.txt

      - name: Build image and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: agent/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          no-cache-filters: python-builder,network-discovery,snmp-discovery,pktvisor,otlpinf,final
          pull: true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [get-next-version, build]
    if: needs.get-next-version.outputs.new-release-published == 'true'
    permissions:
      contents: read
      packages: write
    env:
      BUILD_VERSION: ${{ needs.get-next-version.outputs.new-release-version }}
      REGISTRY: docker.io
      IMAGE_NAME: netboxlabs/orb-agent
    steps:
      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_VERSION }} \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  semantic-release:
    name: Semantic release
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Write package.json
        run: |
          cat > ./package.json <<'EOF'
          {
            "name": "${{ env.APP_NAME }}",
            "version": "1.0.0",
            "devDependencies": {
              "semantic-release-export-data": "^1.0.1",
              "semantic-release": "25.0.0-beta.6",
              "@semantic-release/changelog": "^6.0.3"
            }
          }
          EOF
      - name: Write .releaserc.json
        run: |
          cat > ./.releaserc.json <<'EOF'
          {
            "branches": "release",
            "repositoryUrl": "https://github.com/netboxlabs/orb-agent",
            "debug": "true",
            "tagFormat": "v${version}",
            "plugins": [
              ["semantic-release-export-data"],
              ["@semantic-release/commit-analyzer", {
                "releaseRules": [
                  { "message": "*", "release": "patch"},
                  { "message": "fix*", "release": "patch" },
                  { "message": "feat*", "release": "minor" },
                  { "message": "major*",  "release": "major" }
                ]
              }],
              "@semantic-release/release-notes-generator",
              [
                "@semantic-release/changelog",
                {
                  "changelogFile": "CHANGELOG.md",
                  "changelogTitle": "# Semantic Versioning Changelog"
                }
              ],
              [
                "@semantic-release/github",
                {
                  "assets": [
                    {
                      "path": "release/**"
                    }
                  ]
                }
              ]
            ]
          }
          EOF
      - name: setup semantic-release
        run: npm install --legacy-peer-deps
      - name: Release
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_OBSERVABILITY_RELEASE_WEBHOOK }}
        run: npx semantic-release --debug
