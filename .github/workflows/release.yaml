name: Orb Agent - release

# Orchestrated release. On a push to `release` it detects which components
# changed, releases the changed backends first (each tags <backend>/vX.Y.Z), then
# resolves the backend versions (preferring the just-released version, else the
# latest tag) and releases orb-agent — so the agent image always bundles the
# freshly-released backend versions. Backend-only changes do not cut an agent
# release; they ship via the continuously-rebuilt develop image.
on:
  workflow_dispatch:
  push:
    branches: [ release ]
    # Union of every component's release-relevant paths; the changes job below
    # decides per-component what actually releases.
    paths:
      - "orb-discovery/**"
      - "agent/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      device: ${{ steps.detect.outputs.device }}
      worker: ${{ steps.detect.outputs.worker }}
      network: ${{ steps.detect.outputs.network }}
      snmp: ${{ steps.detect.outputs.snmp }}
      gnmi: ${{ steps.detect.outputs.gnmi }}
      agent: ${{ steps.detect.outputs.agent }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -eu
          # Manual dispatch: treat every component as releasable and let each
          # component's semantic-release decide what (if anything) to publish.
          # This matches the pre-orchestrator behavior where a manual run released
          # regardless of which paths changed, and avoids a HEAD~1 diff wrongly
          # skipping a manual retry or a tip commit that is backend/CI-only.
          if [ "$IS_DISPATCH" = "true" ]; then
            {
              echo "device=true"
              echo "worker=true"
              echo "network=true"
              echo "snmp=true"
              echo "gnmi=true"
              echo "agent=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${BEFORE:-}"
          # Missing/zero/unknown before -> compare against the previous commit;
          # on a normal push compare the pushed range.
          if [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          changed="$(git diff --name-only "$base" "$SHA")"
          echo "Changed files ($base..$SHA):"
          echo "$changed"
          detect() {
            # $1 = include ERE, $2 = optional exclude ERE
            local m
            m="$(printf '%s\n' "$changed" | { grep -E "$1" || true; })"
            if [ -n "${2:-}" ]; then
              m="$(printf '%s\n' "$m" | { grep -vE "$2" || true; })"
            fi
            [ -n "$m" ] && echo true || echo false
          }
          {
            echo "device=$(detect '^orb-discovery/device-discovery/')"
            echo "worker=$(detect '^orb-discovery/worker/')"
            echo "network=$(detect '^orb-discovery/network-discovery/' '^orb-discovery/network-discovery/docker/')"
            echo "snmp=$(detect '^orb-discovery/snmp-discovery/' '^orb-discovery/snmp-discovery/docker/')"
            echo "gnmi=$(detect '^orb-discovery/gnmi-discovery/' '^orb-discovery/gnmi-discovery/docker/')"
            echo "agent=$(detect '^(agent/|cmd/|go\.mod$|go\.sum$)' '^agent/docker/')"
          } >> "$GITHUB_OUTPUT"

  release-device:
    name: Release device-discovery
    needs: changes
    if: ${{ needs.changes.outputs.device == 'true' }}
    uses: ./.github/workflows/_backend-release-python.yaml
    with:
      app-name: device-discovery
      python-package-name: netboxlabs_device_discovery
      python-module: device_discovery
    secrets: inherit

  release-worker:
    name: Release worker
    needs: changes
    if: ${{ needs.changes.outputs.worker == 'true' }}
    uses: ./.github/workflows/_backend-release-python.yaml
    with:
      app-name: worker
      python-package-name: netboxlabs_orb_worker
      python-module: worker
    secrets: inherit

  release-network:
    name: Release network-discovery
    needs: changes
    if: ${{ needs.changes.outputs.network == 'true' }}
    uses: ./.github/workflows/_backend-release-go.yaml
    with:
      app-name: network-discovery
    secrets: inherit

  release-snmp:
    name: Release snmp-discovery
    needs: changes
    if: ${{ needs.changes.outputs.snmp == 'true' }}
    uses: ./.github/workflows/_backend-release-go.yaml
    with:
      app-name: snmp-discovery
    secrets: inherit

  release-gnmi:
    name: Release gnmi-discovery
    needs: changes
    if: ${{ needs.changes.outputs.gnmi == 'true' }}
    uses: ./.github/workflows/_backend-release-go.yaml
    with:
      app-name: gnmi-discovery
    secrets: inherit

  resolve-versions:
    name: Resolve backend versions
    needs: [changes, release-device, release-worker, release-network, release-snmp, release-gnmi]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      network: ${{ steps.combine.outputs.network }}
      snmp: ${{ steps.combine.outputs.snmp }}
      device: ${{ steps.combine.outputs.device }}
      worker: ${{ steps.combine.outputs.worker }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Latest released tag per backend (includes any just-released this run,
      # since this job runs after the backend releases).
      - id: latest
        uses: ./.github/actions/resolve-backend-versions
      - name: Combine released + latest
        id: combine
        env:
          REL_NETWORK: ${{ needs.release-network.outputs.version }}
          REL_SNMP: ${{ needs.release-snmp.outputs.version }}
          REL_DEVICE: ${{ needs.release-device.outputs.version }}
          REL_WORKER: ${{ needs.release-worker.outputs.version }}
          LATEST_NETWORK: ${{ steps.latest.outputs.network }}
          LATEST_SNMP: ${{ steps.latest.outputs.snmp }}
          LATEST_DEVICE: ${{ steps.latest.outputs.device }}
          LATEST_WORKER: ${{ steps.latest.outputs.worker }}
        run: |
          set -eu
          # Prefer the version just released this run; otherwise the latest tag.
          {
            echo "network=${REL_NETWORK:-$LATEST_NETWORK}"
            echo "snmp=${REL_SNMP:-$LATEST_SNMP}"
            echo "device=${REL_DEVICE:-$LATEST_DEVICE}"
            echo "worker=${REL_WORKER:-$LATEST_WORKER}"
          } >> "$GITHUB_OUTPUT"

  agent-release:
    name: Release orb-agent
    needs: [changes, resolve-versions]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.agent == 'true' }}
    uses: ./.github/workflows/_agent-release.yaml
    with:
      network-version: ${{ needs.resolve-versions.outputs.network }}
      snmp-version: ${{ needs.resolve-versions.outputs.snmp }}
      device-version: ${{ needs.resolve-versions.outputs.device }}
      worker-version: ${{ needs.resolve-versions.outputs.worker }}
    secrets: inherit
