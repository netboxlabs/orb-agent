name: Orb Agent - release

# Orchestrated agent release. The per-backend releases are their own top-level
# workflows (so PyPI trusted publishing keeps working — it cannot run from a
# reusable workflow). On a push to `release` this detects which components
# changed, WAITS for the changed backends' release runs to finish (so their new
# <backend>/vX.Y.Z tags exist), resolves those versions, and releases orb-agent
# with them — so the agent image bundles the freshly-released backend versions.
# Backend-only changes do not cut an agent release.
on:
  workflow_dispatch:
  push:
    branches: [ release ]
    # Union of every component's release-relevant paths; the changes job below
    # decides per-component what actually releases.
    paths:
      - "orb-discovery/**"
      - "!orb-discovery/**/docker/**"
      - "orb-telemetry/**"
      - "!orb-telemetry/**/docker/**"
      - "agent/**"
      - "!agent/docker/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      device: ${{ steps.detect.outputs.device }}
      worker: ${{ steps.detect.outputs.worker }}
      network: ${{ steps.detect.outputs.network }}
      snmp: ${{ steps.detect.outputs.snmp }}
      gnmi: ${{ steps.detect.outputs.gnmi }}
      telemetry: ${{ steps.detect.outputs.telemetry }}
      agent: ${{ steps.detect.outputs.agent }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -eu
          # Manual dispatch: treat every component as releasable and let each
          # component's semantic-release decide what (if anything) to publish.
          # This matches the pre-orchestrator behavior where a manual run released
          # regardless of which paths changed, and avoids a HEAD~1 diff wrongly
          # skipping a manual retry or a tip commit that is backend/CI-only.
          if [ "$IS_DISPATCH" = "true" ]; then
            {
              echo "device=true"
              echo "worker=true"
              echo "network=true"
              echo "snmp=true"
              echo "gnmi=true"
              echo "telemetry=true"
              echo "agent=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${BEFORE:-}"
          # Missing/zero/unknown before -> compare against the previous commit;
          # on a normal push compare the pushed range.
          if [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          changed="$(git diff --name-only "$base" "$SHA")"
          echo "Changed files ($base..$SHA):"
          echo "$changed"
          detect() {
            # $1 = include ERE, $2 = optional exclude ERE
            local m
            m="$(printf '%s\n' "$changed" | { grep -E "$1" || true; })"
            if [ -n "${2:-}" ]; then
              m="$(printf '%s\n' "$m" | { grep -vE "$2" || true; })"
            fi
            [ -n "$m" ] && echo true || echo false
          }
          {
            echo "device=$(detect '^orb-discovery/device-discovery/')"
            echo "worker=$(detect '^orb-discovery/worker/')"
            echo "network=$(detect '^orb-discovery/network-discovery/' '^orb-discovery/network-discovery/docker/')"
            echo "snmp=$(detect '^orb-discovery/snmp-discovery/' '^orb-discovery/snmp-discovery/docker/')"
            echo "gnmi=$(detect '^orb-discovery/gnmi-discovery/' '^orb-discovery/gnmi-discovery/docker/')"
            echo "telemetry=$(detect '^orb-telemetry/snmp-telemetry/' '^orb-telemetry/snmp-telemetry/docker/')"
            echo "agent=$(detect '^(agent/|cmd/|go\.mod$|go\.sum$)' '^agent/docker/')"
          } >> "$GITHUB_OUTPUT"

  wait-for-backend-releases:
    name: Wait for backend releases
    needs: changes
    # The backend releases are standalone push-triggered workflows. On a push,
    # wait for the changed ones to finish so their new tags exist before the
    # agent build resolves versions. On workflow_dispatch they aren't push-
    # triggered, so there is nothing to wait for (resolve-versions then just
    # uses the latest tags).
    if: >-
      ${{ github.event_name == 'push' && needs.changes.outputs.agent == 'true' &&
          (needs.changes.outputs.device == 'true' || needs.changes.outputs.worker == 'true' ||
           needs.changes.outputs.network == 'true' || needs.changes.outputs.snmp == 'true' ||
           needs.changes.outputs.gnmi == 'true' || needs.changes.outputs.telemetry == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.sha }}
      DEVICE: ${{ needs.changes.outputs.device }}
      WORKER: ${{ needs.changes.outputs.worker }}
      NETWORK: ${{ needs.changes.outputs.network }}
      SNMP: ${{ needs.changes.outputs.snmp }}
      GNMI: ${{ needs.changes.outputs.gnmi }}
      TELEMETRY: ${{ needs.changes.outputs.telemetry }}
    steps:
      - name: Wait for changed backend release runs
        run: |
          set -eu
          wait_for() {
            local wf="$1" appeared="" run status concl
            for _ in $(seq 1 200); do   # up to ~33 min at 10s
              run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" \
                       --branch "$GITHUB_REF_NAME" --event push \
                       --json databaseId,headSha,status,conclusion --limit 30 \
                     | jq -c --arg sha "$SHA" 'map(select(.headSha==$sha)) | first // empty')"
              if [ -n "$run" ]; then
                appeared=1
                status="$(printf '%s' "$run" | jq -r .status)"
                if [ "$status" = "completed" ]; then
                  concl="$(printf '%s' "$run" | jq -r .conclusion)"
                  case "$concl" in
                    success|skipped) echo "$wf: $concl"; return 0 ;;
                    *) echo "::error::$wf release run concluded '$concl'"; return 1 ;;
                  esac
                fi
              fi
              sleep 10
            done
            if [ -n "$appeared" ]; then
              echo "::error::timed out waiting for $wf"
            else
              echo "::error::no $wf run found for commit $SHA"
            fi
            return 1
          }
          if [ "$DEVICE" = "true" ];  then wait_for device-discovery-release.yaml;  fi
          if [ "$WORKER" = "true" ];  then wait_for worker-release.yaml;            fi
          if [ "$NETWORK" = "true" ]; then wait_for network-discovery-release.yaml; fi
          if [ "$SNMP" = "true" ];    then wait_for snmp-discovery-release.yaml;     fi
          if [ "$GNMI" = "true" ];    then wait_for gnmi-discovery-release.yaml;     fi
          if [ "$TELEMETRY" = "true" ]; then wait_for snmp-telemetry-release.yaml; fi
          echo "all changed backend releases complete"

  resolve-versions:
    name: Resolve backend versions
    needs: [changes, wait-for-backend-releases]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      network: ${{ steps.versions.outputs.network }}
      snmp: ${{ steps.versions.outputs.snmp }}
      gnmi: ${{ steps.versions.outputs.gnmi }}
      device: ${{ steps.versions.outputs.device }}
      worker: ${{ steps.versions.outputs.worker }}
      telemetry: ${{ steps.versions.outputs.telemetry }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # wait-for-backend-releases has ensured any changed backend already tagged
      # its new version, so ls-remote returns the freshly-released versions.
      - id: versions
        uses: ./.github/actions/resolve-backend-versions

  agent-release:
    name: Release orb-agent
    needs: [changes, resolve-versions]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.agent == 'true' }}
    uses: ./.github/workflows/_agent-release.yaml
    with:
      network-version: ${{ needs.resolve-versions.outputs.network }}
      snmp-version: ${{ needs.resolve-versions.outputs.snmp }}
      gnmi-version: ${{ needs.resolve-versions.outputs.gnmi }}
      device-version: ${{ needs.resolve-versions.outputs.device }}
      worker-version: ${{ needs.resolve-versions.outputs.worker }}
      telemetry-version: ${{ needs.resolve-versions.outputs.telemetry }}
    secrets: inherit
