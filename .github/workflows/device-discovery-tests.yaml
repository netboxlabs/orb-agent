name: Device Discovery - test
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - release
    paths:
      - "orb-discovery/device-discovery/**"
  pull_request:
    paths:
      - "orb-discovery/device-discovery/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/_backend-test-python.yaml
    with:
      app-name: device-discovery
      python-module: device_discovery
