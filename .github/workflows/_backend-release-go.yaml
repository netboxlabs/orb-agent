name: Backend release (Go)

# Reusable release for the Go discovery backends (network/snmp/gnmi). It computes
# the next <app>/vX.Y.Z version from the backend's own commits (scoped via
# semantic-release-monorepo) and publishes the tag + GitHub release. The binary
# itself ships via the agent from-source image, so there is no build/publish job.
on:
  workflow_call:
    inputs:
      app-name:
        description: 'Backend app name — the "<app>/v${version}" tag prefix and package name.'
        required: true
        type: string
    outputs:
      released:
        description: 'true if a new release was published this run.'
        value: ${{ jobs.get-next-version.outputs.new-release-published }}
      version:
        description: 'The released version (bare X.Y.Z); empty when nothing was released.'
        value: ${{ jobs.get-next-version.outputs.new-release-version }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  get-next-version:
    name: Semantic release get next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
      - name: Setup semantic-release
        uses: ./.github/actions/setup-semantic-release
        with:
          component: backend
          app-name: ${{ inputs.app-name }}
          working-directory: orb-discovery/${{ inputs.app-name }}
      - name: Release dry-run
        id: get-next-version
        working-directory: orb-discovery/${{ inputs.app-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_SEMANTIC_RELEASE_WEBHOOK }}
        run: npx semantic-release --debug --dry-run
      - name: Set release version
        id: release-version
        run: |
          echo "release-version=$(echo '${{ steps.get-next-version.outputs.new-release-version }}' | sed -E 's|^${{ inputs.app-name }}[-/]||; s|^v||')" >> "$GITHUB_OUTPUT"
    outputs:
      new-release-published: ${{ steps.get-next-version.outputs.new-release-published }}
      new-release-version: ${{ steps.release-version.outputs.release-version }}

  confirm-version:
    name: Next version ${{ needs.get-next-version.outputs.new-release-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: get-next-version
    if: needs.get-next-version.outputs.new-release-published == 'true'
    steps:
      - run: echo "The new release version is ${{ needs.get-next-version.outputs.new-release-version }}"

  semantic-release:
    name: Semantic release
    needs: get-next-version
    if: needs.get-next-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
      - name: Setup semantic-release
        uses: ./.github/actions/setup-semantic-release
        with:
          component: backend
          app-name: ${{ inputs.app-name }}
          working-directory: orb-discovery/${{ inputs.app-name }}
      - name: Release
        working-directory: orb-discovery/${{ inputs.app-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_OBSERVABILITY_RELEASE_WEBHOOK }}
        run: npx semantic-release --debug
