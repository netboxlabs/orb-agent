name: Orb Agent - develop
on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths:
      - "agent/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "orb-discovery/**"
      - "!agent/docker/**"
      - "!orb-discovery/**/docker/**"

permissions:
  contents: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: netboxlabs/orb-agent

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-2vcpu-ubuntu-2404
          - platform: linux/arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Go version from go.mod
        run: echo "GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')" >> $GITHUB_ENV

      - name: Set build info
        run: |
          echo ${GITHUB_SHA::7} > ./agent/version/BUILD_COMMIT.txt
          # Latest AGENT release only: list the agent's v* tags directly. Backend
          # releases are tagged <backend>/v* and are excluded by the refs/tags/v*
          # pattern; ls-remote avoids release-API pagination and works at any clone depth.
          LATEST_RELEASE=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          # Non-release builds carry the short commit SHA so a develop/PR image
          # (e.g. 2.11.0-a1b2c3d) is distinguishable from the clean release (2.11.0).
          # Strip the leading v (LATEST_RELEASE is a v-prefixed tag) to match the
          # release workflow, which stamps the unprefixed version.
          base="${LATEST_RELEASE:-develop}"
          echo "${base#v}-${GITHUB_SHA::7}" > ./agent/version/BUILD_VERSION.txt
          echo "BUILD_COMMIT_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Resolve backend versions
        id: backend-versions
        uses: ./.github/actions/resolve-backend-versions

      - name: Build image and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: agent/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          no-cache-filters: python-builder,pktvisor,otlpinf,final
          pull: true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            BUILD_COMMIT=${{ env.BUILD_COMMIT_SHORT }}
            BUILD_TRACK=develop
            NETWORK_DISCOVERY_VERSION=${{ steps.backend-versions.outputs.network }}
            SNMP_DISCOVERY_VERSION=${{ steps.backend-versions.outputs.snmp }}
            GNMI_DISCOVERY_VERSION=${{ steps.backend-versions.outputs.gnmi }}
            DEVICE_DISCOVERY_VERSION=${{ steps.backend-versions.outputs.device }}
            WORKER_VERSION=${{ steps.backend-versions.outputs.worker }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
