name: gNMI Telemetry - test
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - release
    paths:
      - "orb-telemetry/gnmi-telemetry/**"
      - "!orb-telemetry/gnmi-telemetry/docker/**"
  pull_request:
    paths:
      - "orb-telemetry/gnmi-telemetry/**"
      - "!orb-telemetry/gnmi-telemetry/docker/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/_backend-test-go.yaml
    with:
      app-name: gnmi-telemetry
      parent-dir: orb-telemetry
