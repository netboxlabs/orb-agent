name: ugnmi udiscovery - test
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - release
    paths:
      - "orb-discovery/gnmi-discovery/**"
      - "!orb-discovery/gnmi-discovery/docker/**"
  pull_request:
    paths:
      - "orb-discovery/gnmi-discovery/**"
      - "!orb-discovery/gnmi-discovery/docker/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/_backend-test-go.yaml
    with:
      app-name: gnmi-discovery
