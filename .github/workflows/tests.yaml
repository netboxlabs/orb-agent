name: Orb Agent - tests
on:
  push:
    branches:
      - "!release"
    paths:
      - "agent/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "!agent/docker/**"
  pull_request:
    paths:
      - "agent/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "!agent/docker/**"
      - ".github/workflows/tests.yaml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  go-test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
      - name: Run go build
        run: go build ./...
      - name: Install additional dependencies
        run: |
          go install github.com/mfridman/tparse@v0.14.0
          # The runner reaches its apt mirrors over plain HTTP, and that route
          # has been down for hours at a time, failing every run before a test
          # ran. Retry with a short timeout first, then fall back to the Ubuntu
          # archive over HTTPS, which does not share the port 80 route.
          install_nmap() {
            sudo apt-get -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install nmap
          }
          if ! install_nmap; then
            echo "apt mirrors unreachable, falling back to the Ubuntu archive over HTTPS"
            . /etc/os-release
            fallback=/etc/apt/sources.list.d/zz-https-fallback.list
            printf 'deb https://archive.ubuntu.com/ubuntu %s main universe\ndeb https://archive.ubuntu.com/ubuntu %s-updates main universe\ndeb https://security.ubuntu.com/ubuntu %s-security main universe\n' \
              "$VERSION_CODENAME" "$VERSION_CODENAME" "$VERSION_CODENAME" | sudo tee "$fallback" >/dev/null
            sudo apt-get update -o Dir::Etc::sourcelist="$fallback" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
            install_nmap
          fi
      - name: Run go test
        id: go-test
        run: |
          make test-coverage
          echo 'coverage-report<<EOF' >> $GITHUB_OUTPUT
          cat .coverage/test-report.md >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
          echo "coverage-total=$(cat .coverage/coverage.txt)" >> $GITHUB_OUTPUT
      - name: Output Result
        if: always()
        run: cat .coverage/test-report.md
      - name: Find comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: existing-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Go test coverage
      - name: Post comment
        continue-on-error: true  # Fork PRs have read-only tokens and cannot post comments
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.existing-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Go test coverage
            ${{ steps.go-test.outputs.coverage-report }}
            Total coverage: ${{ steps.go-test.outputs.coverage-total }}%
          edit-mode: replace