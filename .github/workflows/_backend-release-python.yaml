name: Backend release (Python)

# Reusable release for the Python discovery backends (device-discovery, worker).
# Computes the next <app>/vX.Y.Z version from the backend's own commits (scoped
# via semantic-release-monorepo), builds the sdist with the version stamped in,
# publishes to PyPI (trusted publisher / OIDC), and publishes the tag + release.
on:
  workflow_call:
    inputs:
      app-name:
        description: 'Backend app name — the "<app>/v${version}" tag prefix and package name.'
        required: true
        type: string
      python-package-name:
        description: 'PyPI distribution name (e.g. netboxlabs_device_discovery).'
        required: true
        type: string
      python-module:
        description: 'Python package directory containing version.py (e.g. device_discovery).'
        required: true
        type: string
      python-runtime-version:
        description: 'Python version used to build the sdist.'
        required: false
        type: string
        default: "3.11"
    outputs:
      released:
        description: 'true if a new release was published this run.'
        value: ${{ jobs.get-next-version.outputs.new-release-published }}
      version:
        description: 'The released version (bare X.Y.Z); empty when nothing was released.'
        value: ${{ jobs.get-next-version.outputs.new-release-version }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  get-next-version:
    name: Semantic release get next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
      - name: Setup semantic-release
        uses: ./.github/actions/setup-semantic-release
        with:
          component: backend
          app-name: ${{ inputs.app-name }}
          working-directory: orb-discovery/${{ inputs.app-name }}
      - name: Release dry-run
        id: get-next-version
        working-directory: orb-discovery/${{ inputs.app-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_SEMANTIC_RELEASE_WEBHOOK }}
        run: npx semantic-release --debug --dry-run
      - name: Set short sha output
        id: short-sha
        run: echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set release version
        id: release-version
        run: |
          echo "release-version=$(echo '${{ steps.get-next-version.outputs.new-release-version }}' | sed -E 's|^${{ inputs.app-name }}[-/]||; s|^v||')" >> "$GITHUB_OUTPUT"
    outputs:
      new-release-published: ${{ steps.get-next-version.outputs.new-release-published }}
      new-release-version: ${{ steps.release-version.outputs.release-version }}
      short-sha: ${{ steps.short-sha.outputs.short-sha }}

  confirm-version:
    name: Next version ${{ needs.get-next-version.outputs.new-release-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: get-next-version
    if: needs.get-next-version.outputs.new-release-published == 'true'
    steps:
      - run: echo "The new release version is ${{ needs.get-next-version.outputs.new-release-version }} commit ${{ needs.get-next-version.outputs.short-sha }}"

  build:
    name: Build
    needs: get-next-version
    if: needs.get-next-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: orb-discovery/${{ inputs.app-name }}
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_VERSION: ${{ needs.get-next-version.outputs.new-release-version }}
      BUILD_TRACK: release
      BUILD_COMMIT: ${{ needs.get-next-version.outputs.short-sha }}
      OUTPUT_FILENAME: ${{ inputs.python-package-name }}-${{ needs.get-next-version.outputs.new-release-version }}.tar.gz
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-runtime-version }}
      - name: Insert version variables into Python
        run: |
          sed -i "s/__commit_hash__ = .*/__commit_hash__ = \"${BUILD_COMMIT}\"/" ${{ inputs.python-module }}/version.py
          sed -i "s/__track__ = .*/__track__ = \"${BUILD_TRACK}\"/" ${{ inputs.python-module }}/version.py
          sed -i "s/__version__ = .*/__version__ = \"${BUILD_VERSION}\"/" ${{ inputs.python-module }}/version.py
      - name: Display contents of version.py
        run: cat ${{ inputs.python-module }}/version.py
      - name: Build sdist
        run: |
          pip install toml-cli
          toml set --toml-path pyproject.toml project.version ${{ env.BUILD_VERSION }}
          cat pyproject.toml | grep version
          python3 -m pip install --upgrade build
          python3 -m build --sdist --outdir dist/
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.OUTPUT_FILENAME }}
          path: orb-discovery/${{ inputs.app-name }}/dist/${{ env.OUTPUT_FILENAME }}
          retention-days: 30
          if-no-files-found: error
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: orb-discovery/${{ inputs.app-name }}/dist

  semantic-release:
    name: Semantic release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
      - name: Setup semantic-release
        uses: ./.github/actions/setup-semantic-release
        with:
          component: backend
          app-name: ${{ inputs.app-name }}
          working-directory: orb-discovery/${{ inputs.app-name }}
      - name: Release
        working-directory: orb-discovery/${{ inputs.app-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_OBSERVABILITY_RELEASE_WEBHOOK }}
        run: npx semantic-release --debug
