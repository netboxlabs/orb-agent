name: Backend test (Go)

# Reusable go build + test + coverage for a Go backend (lint lives in the
# whole-repo lint workflow).
on:
  workflow_call:
    inputs:
      app-name:
        description: 'Backend app name (directory under parent-dir).'
        required: true
        type: string
      parent-dir:
        description: 'Parent directory holding the backend (orb-discovery or orb-telemetry).'
        required: false
        default: orb-discovery
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: ${{ inputs.parent-dir }}/${{ inputs.app-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: '${{ inputs.parent-dir }}/${{ inputs.app-name }}/go.mod'
      - name: Run go build
        run: go build ./...
      - name: Install additional dependencies
        run: |
          go install github.com/mfridman/tparse@v0.14.0
          # snmp/gnmi/snmp-telemetry test-coverage targets call gcov2lcov
          # (network's does not); install it for all four (harmless where unused).
          go install github.com/jandelgado/gcov2lcov@v1.1.1
          sudo apt-get -y install nmap
          sudo setcap cap_net_raw,cap_net_admin=eip $(which nmap)
      - name: Run go test
        id: go-test
        run: |
          make test-coverage
          echo 'coverage-report<<EOF' >> $GITHUB_OUTPUT
          cat .coverage/test-report.md >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
          echo "coverage-total=$(cat .coverage/coverage.txt)" >> $GITHUB_OUTPUT
      - name: Output Result
        if: always()
        run: cat .coverage/test-report.md
      - name: Find comment
        # Only on pull_request: on push runs there is no pull_request.number, and
        # find-comment v4 coerces the empty input to 0 and fails the job.
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: existing-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Go test coverage
      - name: Post comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          comment-id: ${{ steps.existing-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Go test coverage
            ${{ steps.go-test.outputs.coverage-report }}
            Total coverage: ${{ steps.go-test.outputs.coverage-total }}%
          edit-mode: replace
