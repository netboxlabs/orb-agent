name: Worker - test
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - release
    paths:
      - "orb-discovery/worker/**"
  pull_request:
    paths:
      - "orb-discovery/worker/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/_backend-test-python.yaml
    with:
      app-name: worker
      python-module: worker
