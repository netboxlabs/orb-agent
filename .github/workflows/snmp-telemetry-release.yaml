name: SNMP Telemetry - release

# Thin top-level caller so this is a standalone run the agent release can wait
# for; the Go backends have no PyPI publish, so the reusable is fine here.
on:
  workflow_dispatch:
  push:
    branches: [ release ]
    paths:
      - "orb-telemetry/snmp-telemetry/**"
      - "!orb-telemetry/snmp-telemetry/docker/**"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: ./.github/workflows/_backend-release-go.yaml
    with:
      app-name: snmp-telemetry
      parent-dir: orb-telemetry
    secrets: inherit
