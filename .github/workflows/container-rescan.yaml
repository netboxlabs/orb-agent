name: Scheduled Container Rescan

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

env:
  IMAGE_REF: docker.io/netboxlabs/orb-agent:develop

jobs:
  rescan:
    name: Rescan Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      TRIVY_DISABLE_VEX_NOTICE: "true"

    steps:
      # Only needed for .trivyignore.yaml: the scan target is the published
      # image, not the working tree. The ignore file tracks the default branch,
      # so an entry that expires takes effect on the next nightly run.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Pull image
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: docker pull "$IMAGE_REF"

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: json
          output: trivy-output.json
          vuln-type: os,library
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: "0"
          # Trivy only auto-detects a plain .trivyignore in the working
          # directory, so the YAML variant has to be named explicitly.
          trivyignores: .trivyignore.yaml

      - name: Build rescan summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('trivy-output.json', 'utf8'));
            const vulns = (data.Results || []).flatMap(r =>
              (r.Vulnerabilities || []).map(v => ({ ...v, target: r.Target }))
            );

            const SEVERITY_LABEL = {
              CRITICAL: '🔴 **CRITICAL**',
              HIGH: '🟠 **HIGH**',
              MEDIUM: '🟡 MEDIUM',
              LOW: '⚪ LOW'
            };

            let summary = `### Rescan Complete\n\n`;
            summary += `**Image:** \`${process.env.IMAGE_REF}\`\n`;
            summary += `**Scanned at:** ${new Date().toISOString().replace('T', ' ').split('.')[0]} UTC\n\n`;

            if (vulns.length === 0) {
              summary += '_No vulnerabilities found._\n';
            } else {
              summary += `| Source | Library | CVE | Severity | Installed | Fixed | Title |\n`;
              summary += `|---|---|---|---|---|---|---|\n`;
              for (const v of vulns) {
                const title = (v.Title || '').replace(/\|/g, '\\|').substring(0, 80);
                const cve = v.PrimaryURL ? `[${v.VulnerabilityID}](${v.PrimaryURL})` : v.VulnerabilityID;
                const source = (v.target || '').replace(/\|/g, '\\|');
                summary += `| ${source} | ${v.PkgName} | ${cve} | ${SEVERITY_LABEL[v.Severity] || v.Severity} | ${v.InstalledVersion} | ${v.FixedVersion || 'N/A'} | ${title} |\n`;
              }
            }

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

      - name: Convert scan results to SARIF
        if: "!cancelled()"
        run: trivy convert --format sarif --output trivy-results.sarif trivy-output.json

      - name: Upload SARIF to GitHub Code Scanning
        if: "!cancelled()"
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          sarif_file: trivy-results.sarif
