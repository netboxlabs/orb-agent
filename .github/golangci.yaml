version: "2"
run:
  modules-download-mode: readonly
  relative-path-mode: gomod
linters:
  enable:
    - bodyclose
    - depguard
    - revive
  settings:
    depguard:
      rules:
        yaml:
          deny:
            - pkg: gopkg.in/yaml.v3
              desc: use go.yaml.in/yaml/v3, which reports a merge key beside a mapping key instead of panicking
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
        path: /*.go
        text: 'package-comments: should have a package comment'
    paths:
      - third_party$
      - builtin$
      - examples$
severity:
  default: error
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/netboxlabs/orb-agent)
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
