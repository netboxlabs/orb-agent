orb:
  config_manager:
    active: fleet
    sources:
      orb:
        token_url: ${FLEET_AUTH_URL}
        client_id: ${FLEET_CLIENT_ID}
        client_secret: ${FLEET_CLIENT_SECRET}
  backends:
    network_discovery:
    device_discovery:
    snmp_discovery:
    opentelemetry_infinity:
    pktvisor:
      taps:
        default:
          input_type: pcap
          config:
            iface: auto
    common:
      diode:
        dry_run: true
      otlp:
        http: http://localhost:4320
        grpc: http://localhost:4321