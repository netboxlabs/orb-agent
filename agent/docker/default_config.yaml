orb:
  config_manager:
    active: fleet
    sources:
      fleet:
        token_url: ${FLEET_AUTH_URL}
        client_id: ${FLEET_CLIENT_ID}
        client_secret: ${FLEET_CLIENT_SECRET}
  secrets_manager:
    active: fleet
    sources:
      fleet:
        timeout: 30
  files_manager:
    active: fleet
    sources:
      fleet: {}
  backends:
    network_discovery:
    device_discovery:
    snmp_discovery:
    worker:
    snmp_telemetry:
      start_mode: on_demand
    gnmi_telemetry:
      start_mode: on_demand
    pktvisor:
      start_mode: on_demand
