# Accepted findings for the container scan in build.yaml and container-rescan.yaml.
#
# Every entry is time-boxed. When an entry expires the finding reappears and
# blocks the build again, which is deliberate: an accepted risk should be
# re-argued periodically, not inherited silently.
#
# How to re-check an entry before extending it:
#   1. Is there a newer pip whose vendored SBOM raises the pinned version?
#        curl -s https://pypi.org/pypi/pip/json | python3 -c \
#          "import sys,json;print(json.load(sys.stdin)['info']['version'])"
#      then read _vendor/bom.cdx.json from that release's wheel. The scanner
#      reads this file; _vendor/vendor.txt lists the same pins but is not read.
#   2. Is the vulnerable code actually shipped, or is the SBOM the only trace?
#        docker run --rm --entrypoint sh netboxlabs/orb-agent:<tag> -c \
#          "ls /usr/local/lib/python3.14/site-packages/pip/_vendor/"
#   If either answer changed, fix it rather than extending the entry.

vulnerabilities:
  # pip vendors its own dependency set under pip/_vendor and describes it in a
  # CycloneDX SBOM, pip/_vendor/bom.cdx.json, which the image scanner reads as
  # if each component were an independently installed distribution. They are
  # not: they have no dist-info of their own, and the scan records them in pip's
  # own layer with no file path, unlike every genuinely installed package.
  #
  # pip is in the image only to serve the documented INSTALL_DRIVERS_PATH and
  # INSTALL_WORKERS_PATH options (see docs/config_samples.md). It is invoked by
  # the entrypoint solely when an operator sets one of those, and never during
  # normal agent operation.

  - id: CVE-2025-47273
    statement: >-
      setuptools reported at 70.3.0 from pip 26.3's vendored SBOM. The
      vulnerable code is not in the image: pip no longer ships
      _vendor/setuptools at all, only _vendor/pkg_resources, so PackageIndex,
      the component this path traversal affects, is absent. The finding is
      SBOM metadata rather than reachable code. pip 26.3 is the current latest
      release and still pins this version, as does pip's main branch, so there
      is no upgrade that clears it.
    expired_at: 2027-01-15

  - id: CVE-2026-59890
    statement: >-
      setuptools reported at 70.3.0 from pip 26.3's vendored SBOM, the same
      source as CVE-2025-47273 above and absent for the same reason: pip ships
      no _vendor/setuptools, only _vendor/pkg_resources, so the sdist build
      path this affects is not in the image. The finding is SBOM metadata
      rather than reachable code. pip 26.3 is the current latest release and
      still pins this version, as does pip's main branch, so there is no
      upgrade that clears it.
    expired_at: 2027-01-15

  - id: GHSA-xmj3-9gf7-h52w
    statement: >-
      setuptools reported at 70.3.0 from pip 26.3's vendored SBOM, the same
      source as CVE-2025-47273 above and absent for the same reason: the flaw is
      in setuptools/wheel.py, and pip ships no _vendor/setuptools, only
      _vendor/pkg_resources. It also only escapes the destination directory on
      Windows, and the image is Linux. The finding is SBOM metadata
      rather than reachable code. pip 26.3 is the current latest release and
      still pins this version, as does pip's main branch, so there is no
      upgrade that clears it.
    expired_at: 2027-01-15
