# Calix — sysObjectID -> device model lookups for SNMP discovery.
# Manufacturer (IANA PEN 6321) is canonicalized in _manufacturers_ndx.yaml; this
# file maps each model's sysObjectID to its model name. Scoped to the device-level
# nodes in CALIX-PRODUCT-MIB: the C7 shelf and the E-series access nodes
# (e7Devices subtree); C7 line-card/port/component registrations are excluded.
# A model NDX catalogs is named as its NDX device type, so the device binds to
# the imported type; the others keep their existing name.
devices:
  .1.3.6.1.4.1.6321.1.2.1.1: c7ShelfAssembly
  .1.3.6.1.4.1.6321.1.2.2.5.1: E5-312
  .1.3.6.1.4.1.6321.1.2.2.5.2: E5-400
  .1.3.6.1.4.1.6321.1.2.2.5.3: e7x2
  .1.3.6.1.4.1.6321.1.2.2.5.4: E7-20
  .1.3.6.1.4.1.6321.1.2.2.5.5: e3x48
  .1.3.6.1.4.1.6321.1.2.2.5.6: e5x48
  .1.3.6.1.4.1.6321.1.2.2.5.7: E3-8G
  .1.3.6.1.4.1.6321.1.2.3: e5x100
  .1.3.6.1.4.1.6321.1.2.4.1.1: E7-2
  .1.3.6.1.4.1.6321.1.2.4.1.3: E3-16F
