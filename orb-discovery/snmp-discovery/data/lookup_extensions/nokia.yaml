# Nokia — sysObjectID -> device model lookups for SNMP discovery.
# Manufacturer is canonicalized in _manufacturers_ndx.yaml (PEN 6527 SR OS, and
# PEN 7483 for the 1830 PSS optical line). Nokia device sysObjectIDs live in two
# registries, so this file scopes to the device-model nodes (not the surrounding
# MIB-object registrations):
