# LANCOM Systems — sysObjectID -> device model lookups for SNMP discovery.
# Manufacturer (IANA PEN 2356) is canonicalized in _manufacturers_ndx.yaml; this file
# maps each model's sysObjectID to its model name. Entries are the LCOS-SX switch
# products (GS/XS series) under .1.3.6.1.4.1.2356.16.8 from LCOS-SX-PRODUCTS-MIB.
# A model NDX catalogs is named as its NDX device type, so the device binds to
# the imported type; the others keep their existing name.
devices:
  .1.3.6.1.4.1.2356.16.8.4530: GS-4530X
  .1.3.6.1.4.1.2356.16.8.4531: GS-4530XP
  .1.3.6.1.4.1.2356.16.8.4554: GS-4554X
  .1.3.6.1.4.1.2356.16.8.4555: GS-4554XP
  .1.3.6.1.4.1.2356.16.8.5110: XS-5110F
  .1.3.6.1.4.1.2356.16.8.5116: XS-5116QF
  .1.3.6.1.4.1.2356.16.8.6128: XS-6128QF
