entries:
  # Interface mappings
  - oid: ".1.3.6.1.2.1.2.2.1"
    entity: "interface"
    field: "_id"
    identifier_size: 1
    mapping_entries:
      - oid: ".1.3.6.1.2.1.2.2.1.2"
        entity: "interface"
        field: "name"
      - oid: ".1.3.6.1.2.1.2.2.1.3"
        entity: "interface"
        field: "type"
      - oid: ".1.3.6.1.2.1.2.2.1.4"
        entity: "interface"
        field: "mtu"
      - oid: ".1.3.6.1.2.1.2.2.1.5"
        entity: "interface"
        field: "speed"
      - oid: ".1.3.6.1.2.1.2.2.1.6"
        entity: "interface"
        field: "macAddress"
      - oid: ".1.3.6.1.2.1.2.2.1.7"
        entity: "interface"
        field: "adminStatus"
      - oid: ".1.3.6.1.2.1.31.1.1.1.1"
        entity: "interface"
        field: "name_alternate"
      - oid: ".1.3.6.1.2.1.31.1.1.1.15"
        entity: "interface"
        field: "highSpeed"
      - oid: ".1.3.6.1.2.1.31.1.1.1.18"
        entity: "interface"
        field: "description"

  # IP Address mappings — legacy ipAddrTable (RFC 1213; IPv4 only)
  - oid: ".1.3.6.1.2.1.4.20.1"
    entity: "ipAddress"
    field: "_id"
    identifier_size: 4
    mapping_entries:
      - oid: ".1.3.6.1.2.1.4.20.1.1"
        entity: "ipAddress"
        field: "address"
      - oid: ".1.3.6.1.2.1.4.20.1.3"
        entity: "ipAddress"
        field: "addressPrefixSize"
      - oid: ".1.3.6.1.2.1.4.20.1.2"
        entity: "ipAddress"
        field: "assignedObject"
        relationship:
          type: "interface"
          field: "_id"

  # IP Address mappings — RFC 4293 ipAddressTable (IPv4 + IPv6)
  - oid: ".1.3.6.1.2.1.4.34.1"
    entity: "ipAddress"
    field: "_id"
    index_kind: "inet_address"
    mapping_entries:
      - oid: ".1.3.6.1.2.1.4.34.1.3"
        entity: "ipAddress"
        field: "assignedObject"
        relationship:
          type: "interface"
          field: "_id"
      - oid: ".1.3.6.1.2.1.4.34.1.4"
        entity: "ipAddress"
        field: "addressType"
      - oid: ".1.3.6.1.2.1.4.34.1.5"
        entity: "ipAddress"
        field: "addressPrefix"
      - oid: ".1.3.6.1.2.1.4.34.1.7"
        entity: "ipAddress"
        field: "addressStatus"
      - oid: ".1.3.6.1.2.1.4.34.1.10"
        entity: "ipAddress"
        field: "addressRowStatus"

  # Device mappings.
  #
  # sysContact (.1.3.6.1.2.1.1.4.0) and sysLocation (.1.3.6.1.2.1.1.6.0)
  # are walked but not consumed directly by the device mapper. They are
  # available for PolicyConfig.Defaults.{Location,AssetTag} to reference
  # by OID, e.g.:
  #
  #   defaults:
  #     location: ".1.3.6.1.2.1.1.6.0"   # populate from sysLocation
  #     asset_tag: ".1.3.6.1.2.1.1.4.0"  # populate from sysContact
  #
  # See data.ResolveDefault for the resolution semantics. OID references
  # in defaults can resolve only against the walked snapshot of this
  # system-group Map() call — references to OIDs in other mapping groups
  # (interfaces, ENTITY-MIB rows, etc.) will not resolve.
  - oid: ".1.3.6.1.2.1.1"
    entity: "device"
    field: "_id"
    mapping_entries:
      - oid: ".1.3.6.1.2.1.1.1.0"
        entity: "device"
        field: "description"
      - oid: ".1.3.6.1.2.1.1.2.0"
        entity: "device"
        field: "platform"
      - oid: ".1.3.6.1.2.1.1.4.0"
        entity: "device"
        field: "sysContact"
        description: "Walked solely so defaults.asset_tag or defaults.location can reference it via OID. Not consumed by the mapper directly."
      - oid: ".1.3.6.1.2.1.1.5.0"
        entity: "device"
        field: "name"
      - oid: ".1.3.6.1.2.1.1.6.0"
        entity: "device"
        field: "sysLocation"
        description: "Walked solely so defaults.location or defaults.asset_tag can reference it via OID. Not consumed by the mapper directly."

  # ENTITY-MIB entPhysicalTable — chassis inventory for stack detection.
  # Consumed by mapping.TranslateAsStack as a post-pass; the
  # ChassisInventoryMapper.Map is a no-op. Master device Serial is set
  # from entPhysicalSerialNum here (replacing the DeviceMapper
  # "serialNumber" branch). identifier_size: 2 keys rows by (column, row)
  # disjoint from ifIndex buckets.
  - oid: ".1.3.6.1.2.1.47.1.1.1"
    entity: "chassis_inventory"
    field: "_id"
    identifier_size: 2
    description: "ENTITY-MIB entPhysicalTable (chassis physical inventory for stack detection)"
    mapping_entries:
      - oid: ".1.3.6.1.2.1.47.1.1.1.1.2"   # entPhysicalDescr
        entity: "chassis_module"
        field: "descr"
      - oid: ".1.3.6.1.2.1.47.1.1.1.1.3"   # entPhysicalVendorType
        entity: "chassis_module"
        field: "vendor_type"
      - oid: ".1.3.6.1.2.1.47.1.1.1.1.4"   # entPhysicalContainedIn
        entity: "chassis_inventory"
        field: "containedIn"
      - oid: ".1.3.6.1.2.1.47.1.1.1.1.5"   # entPhysicalClass
        entity: "chassis_inventory"
        field: "class"
      - oid: ".1.3.6.1.2.1.47.1.1.1.1.6"   # entPhysicalParentRelPos
        entity: "chassis_inventory"
        field: "parentRelPos"
      - oid: ".1.3.6.1.2.1.47.1.1.1.1.7"   # entPhysicalName
        entity: "chassis_inventory"
        field: "name"
      - oid: ".1.3.6.1.2.1.47.1.1.1.1.11"  # entPhysicalSerialNum
        entity: "chassis_inventory"
        field: "serialNumber"
      - oid: ".1.3.6.1.2.1.47.1.1.1.1.13"  # entPhysicalModelName
        entity: "chassis_inventory"
        field: "modelName"

  # ENTITY-MIB entAliasMappingTable — maps entPhysicalIndex -> ifIndex
  # for stack-member interface routing. Column .2 holds an OID like
  # .1.3.6.1.2.1.2.2.1.1.<ifIndex>.
  - oid: ".1.3.6.1.2.1.47.1.3.2"
    entity: "chassis_inventory"
    field: "_id"
    identifier_size: 2
    description: "ENTITY-MIB entAliasMappingTable (entPhysicalIndex -> ifIndex)"
    mapping_entries:
      - oid: ".1.3.6.1.2.1.47.1.3.2.1.2"
        entity: "chassis_inventory"
        field: "aliasMapping"
  # BRIDGE-MIB dot1dBasePortIfIndex — bridge port -> ifIndex translation.
  # Required by VlanMapper bitmap decoding.
  - oid: ".1.3.6.1.2.1.17.1.4.1"
    entity: "interface_vlan"
    field: "_id"
    identifier_size: 1
    description: "BRIDGE-MIB dot1dBasePortTable (bridge-port -> ifIndex map)"
    mapping_entries:
      - oid: ".1.3.6.1.2.1.17.1.4.1.2"
        entity: "interface_vlan"
        field: "ifIndex"

  # Q-BRIDGE-MIB dot1qVlanStaticTable — VLAN names + egress/untagged port masks.
  - oid: ".1.3.6.1.2.1.17.7.1.4.3"
    entity: "vlan"
    field: "_id"
    identifier_size: 1
    description: "Q-BRIDGE-MIB dot1qVlanStaticTable (VLAN catalog + per-VLAN egress masks)"
    mapping_entries:
      - oid: ".1.3.6.1.2.1.17.7.1.4.3.1.1"
        entity: "vlan"
        field: "name"
      - oid: ".1.3.6.1.2.1.17.7.1.4.3.1.2"
        entity: "vlan"
        field: "egressPorts"
      - oid: ".1.3.6.1.2.1.17.7.1.4.3.1.4"
        entity: "vlan"
        field: "untaggedPorts"
      - oid: ".1.3.6.1.2.1.17.7.1.4.3.1.5"
        entity: "vlan"
        field: "rowStatus"

  # Q-BRIDGE-MIB dot1qPortVlanTable — per-port PVID.
  - oid: ".1.3.6.1.2.1.17.7.1.4.5"
    entity: "interface_vlan"
    field: "_id"
    identifier_size: 1
    description: "Q-BRIDGE-MIB dot1qPortVlanTable (PVID + acceptable frame types)"
    mapping_entries:
      - oid: ".1.3.6.1.2.1.17.7.1.4.5.1.1"
        entity: "interface_vlan"
        field: "pvid"

  # CISCO-VLAN-MEMBERSHIP-MIB vmMembershipTable — non-trunk access VLAN per ifIndex.
  - oid: ".1.3.6.1.4.1.9.9.68.1.2.2.1"
    entity: "interface_vlan"
    field: "_id"
    identifier_size: 1
    vendor: "cisco"
    description: "CISCO-VLAN-MEMBERSHIP-MIB vmMembershipTable (access VLAN refinement)"
    mapping_entries:
      - oid: ".1.3.6.1.4.1.9.9.68.1.2.2.1.2"
        entity: "interface_vlan"
        field: "vmVlan"

  # CISCO-VOICE-VLAN-MIB vmVoiceVlanTable — per-port voice VLAN.
  # Sentinels: 0 = none, 4095 = dot1p-only, 4096 = untagged.
  - oid: ".1.3.6.1.4.1.9.9.68.1.5.1"
    entity: "interface_vlan"
    field: "_id"
    identifier_size: 1
    vendor: "cisco"
    description: "CISCO-VOICE-VLAN-MIB vmVoiceVlanTable (voice VLAN promotion)"
    mapping_entries:
      - oid: ".1.3.6.1.4.1.9.9.68.1.5.1.1"
        entity: "interface_vlan"
        field: "vmVoiceVlanId"

  # --- VRF discovery (gated by options.discover_vrfs) ------------------- #
  # Three MIB tiers, resolved in order by mapping.TranslateVrfs: the
  # standards-based MPLS-L3VPN-STD-MIB, the pre-standard MPLS-VPN-MIB
  # (experimental arc, common on older Cisco IOS), and CISCO-VRF-MIB for
  # VRF-lite platforms without the MPLS feature MIBs. The "vrf" entity is
  # a pseudo-type: rows are consumed wholesale by the runner-level VRF
  # translation pass, not by per-row mappers.
  - oid: ".1.3.6.1.2.1.10.166.11.1.2.2.1.4"
    entity: "vrf"
    field: "mplsL3VpnVrfRD"
    identifier_size: 1
    description: "MPLS-L3VPN-STD-MIB mplsL3VpnVrfRD (VRF names + route distinguishers)"
  - oid: ".1.3.6.1.2.1.10.166.11.1.2.1.1.2"
    entity: "vrf"
    field: "mplsL3VpnIfVpnClassification"
    identifier_size: 1
    description: "MPLS-L3VPN-STD-MIB mplsL3VpnIfConfTable (VRF interface membership)"
  - oid: ".1.3.6.1.3.118.1.2.2.1.3"
    entity: "vrf"
    field: "mplsVpnVrfRouteDistinguisher"
    identifier_size: 1
    description: "MPLS-VPN-MIB mplsVpnVrfRouteDistinguisher (legacy VRF names + RDs)"
  - oid: ".1.3.6.1.3.118.1.2.1.1.2"
    entity: "vrf"
    field: "mplsVpnIfVpnClassification"
    identifier_size: 1
    description: "MPLS-VPN-MIB mplsVpnIfConfTable (legacy VRF interface membership)"
  - oid: ".1.3.6.1.4.1.9.9.711.1.1.1.1.2"
    entity: "vrf"
    field: "cvVrfName"
    identifier_size: 1
    vendor: "cisco"
    description: "CISCO-VRF-MIB cvVrfName (VRF-lite names, no RD)"
  - oid: ".1.3.6.1.4.1.9.9.711.1.2.1.1.2"
    entity: "vrf"
    field: "cvVrfInterfaceType"
    identifier_size: 1
    vendor: "cisco"
    description: "CISCO-VRF-MIB cvVrfInterfaceTable (VRF-lite interface membership)"
