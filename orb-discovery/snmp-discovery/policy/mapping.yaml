entries:
  # Interface mappings
  - oid: ".1.3.6.1.2.1.2.2.1"
    entity: "interface"
    field: "_id"
    identifier_size: 1
    mapping_entries:
      - oid: ".1.3.6.1.2.1.2.2.1.2"
        entity: "interface"
        field: "name"
      - oid: ".1.3.6.1.2.1.2.2.1.3"
        entity: "interface"
        field: "type"
      - oid: ".1.3.6.1.2.1.2.2.1.4"
        entity: "interface"
        field: "mtu"
      - oid: ".1.3.6.1.2.1.2.2.1.5"
        entity: "interface"
        field: "speed"
      - oid: ".1.3.6.1.2.1.2.2.1.6"
        entity: "interface"
        field: "macAddress"
      - oid: ".1.3.6.1.2.1.2.2.1.7"
        entity: "interface"
        field: "adminStatus"
      - oid: ".1.3.6.1.2.1.31.1.1.1.1"
        entity: "interface"
        field: "name_alternate"
      - oid: ".1.3.6.1.2.1.31.1.1.1.15"
        entity: "interface"
        field: "highSpeed"
      - oid: ".1.3.6.1.2.1.31.1.1.1.18"
        entity: "interface"
        field: "description"

  # IP Address mappings — legacy ipAddrTable (RFC 1213; IPv4 only)
  - oid: ".1.3.6.1.2.1.4.20.1"
    entity: "ipAddress"
    field: "_id"
    identifier_size: 4
    mapping_entries:
      - oid: ".1.3.6.1.2.1.4.20.1.1"
        entity: "ipAddress"
        field: "address"
      - oid: ".1.3.6.1.2.1.4.20.1.3"
        entity: "ipAddress"
        field: "addressPrefixSize"
      - oid: ".1.3.6.1.2.1.4.20.1.2"
        entity: "ipAddress"
        field: "assignedObject"
        relationship:
          type: "interface"
          field: "_id"

  # IP Address mappings — RFC 4293 ipAddressTable (IPv4 + IPv6)
  - oid: ".1.3.6.1.2.1.4.34.1"
    entity: "ipAddress"
    field: "_id"
    index_kind: "inet_address"
    mapping_entries:
      - oid: ".1.3.6.1.2.1.4.34.1.3"
        entity: "ipAddress"
        field: "assignedObject"
        relationship:
          type: "interface"
          field: "_id"
      - oid: ".1.3.6.1.2.1.4.34.1.4"
        entity: "ipAddress"
        field: "addressType"
      - oid: ".1.3.6.1.2.1.4.34.1.5"
        entity: "ipAddress"
        field: "addressPrefix"
      - oid: ".1.3.6.1.2.1.4.34.1.7"
        entity: "ipAddress"
        field: "addressStatus"
      - oid: ".1.3.6.1.2.1.4.34.1.10"
        entity: "ipAddress"
        field: "addressRowStatus"

  # Device mappings
  - oid: ".1.3.6.1.2.1.1"
    entity: "device"
    field: "_id"
    mapping_entries:
      - oid: ".1.3.6.1.2.1.1.1.0"
        entity: "device"
        field: "description"
      - oid: ".1.3.6.1.2.1.1.2.0"
        entity: "device"
        field: "platform"
      - oid: ".1.3.6.1.2.1.1.5.0"
        entity: "device"
        field: "name"

  # Device serial number (ENTITY-MIB entPhysicalSerialNum).
  # identifier_size: 2 uses the last two OID components (column.row,
  # e.g. "11.1") as the grouping index, which is disjoint from the
  # single-component ifIndex values ("1", "2", ...) used by the
  # interface table. This prevents groupByObjectIDIndex from merging
  # serial PDUs into interface index buckets.
  - oid: ".1.3.6.1.2.1.47.1.1.1"
    entity: "device"
    field: "_id"
    identifier_size: 2
    mapping_entries:
      - oid: ".1.3.6.1.2.1.47.1.1.1.1.11"
        entity: "device"
        field: "serialNumber"