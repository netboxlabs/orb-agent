# Huawei VRP / CloudEngine. OpenConfig modules are advertised (openconfig-interfaces,
# -platform, -system, -network-instance) but module presence != leaf coverage:
# expect _base to populate device/interface basics and graceful-empty for the weak
# leaves below. Per-vendor leaf-path overrides are DEFERRED until a real CloudEngine
# capture exists (no speculative paths — they could suppress a working _base path).
# Known weak leaves to revisit with a capture:
#   - ethernet/switched-vlan/* ; network-instances/.../vlans
#   - ethernet/state/aggregate-id ; negotiated-duplex-mode
#   - components/.../state serial-no / part-no / mfg-name completeness
# Supported telemetry paths vary by device (check "display telemetry sensor-path").
# Interface name typing (10GE/25GE/40GE/100GE/Eth-Trunk/Vlanif) is handled by the
# global defaultInterfacePatterns, not here.
extends: _base
match:
  vendor: Huawei
