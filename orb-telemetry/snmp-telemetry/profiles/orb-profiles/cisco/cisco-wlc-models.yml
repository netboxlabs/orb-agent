# Additional wireless controller sysObjectIDs for the bundled cisco/cisco-wlc.yml profile.
# IDs and model names from DataDog/integrations-core default_profiles/cisco-catalyst-wlc.yaml
# and cisco-legacy-wlc.yaml at c545ca5b168e1ccbffba82121cda46fa09459a46 (BSD-3-Clause, see ../LICENSE).
# Metrics are inherited from the Kentik profile. One entry is redeclared below
# so that it keeps ranking as the profile's own in the metric-name contest.
---
extends:
  - cisco-wlc.yml

provider: kentik-wireless-controller

sysobjectid:
  # cisco-catalyst-wlc.yaml
  - 1.3.6.1.4.1.9.1.2025    # cisco5700WLC
  - 1.3.6.1.4.1.9.1.2531    # ciscoAIRCT9880K9
  - 1.3.6.1.4.1.9.1.2669    # ciscoC980080K9
  - 1.3.6.1.4.1.9.1.2825    # ciscoCMeWlc
  - 1.3.6.1.4.1.9.1.3324    # ciscoCW9800H1
  # cisco-legacy-wlc.yaml
  - 1.3.6.1.4.1.9.1.818     # ciscoNMWLCE
  - 1.3.6.1.4.1.9.1.926     # cisco520WLC

metrics:
  # Copied verbatim from cisco-wlc.yml. As an inherited entry it would lose
  # the snmp.cpu name to the generic Cisco CPU symbol; as an own entry it wins,
  # which is what happens in the parent.
  - MIB: AIRESPACE-SWITCHING-MIB
    symbols:
      # Current CPU Load of the switch in percentage.
      # Polled at 60s to support anomaly detection.
      - name: agentCurrentCPUUtilization
        OID: 1.3.6.1.4.1.14179.1.1.5.1.0
        poll_time_sec: 60
        tag: CPU
