# Conversion rules: ../PROVENANCE.md
---
extends:
  - system-mib.yml
  - if-mib.yml
  - ip-mib.yml
  - tcp-mib.yml
  - udp-mib.yml

provider: kentik-switch

sysobjectid:
  - 1.3.6.1.4.1.21671      # Netscout, enterprise root as some units report it
  - 1.3.6.1.4.1.21671.*    # Netscout packet flow switches

# Device identity, applied to every series from the device.
metric_tags:
  - column:
      OID: 1.3.6.1.4.1.21671.3.2.1.1.5.0
      name: nphDeviceModelName
  - column:
      OID: 1.3.6.1.4.1.21671.3.2.1.1.4.0
      name: nphDeviceSerialNumber

metrics:
  # Memory per management module. Upstream multiplied these by 1024; they are
  # exported here as the device reports them, in kilobytes.
  # Upstream also tagged each row with its positional index; this collector
  # keeps rows apart by row_index instead.
  - MIB: NTCT-PFS-HEALTH-MIB
    table:
      OID: 1.3.6.1.4.1.21671.3.2.1.1.6
      name: nphMemoryTable
    symbols:
      - OID: 1.3.6.1.4.1.21671.3.2.1.1.6.1.2
        name: memory.total
      - OID: 1.3.6.1.4.1.21671.3.2.1.1.6.1.3
        name: memory.free

  # CPU utilisation per management module, in percent.
  - MIB: NTCT-PFS-HEALTH-MIB
    table:
      OID: 1.3.6.1.4.1.21671.3.2.1.1.7
      name: nphCPUTable
    symbols:
      - OID: 1.3.6.1.4.1.21671.3.2.1.1.7.1.2
        name: cpu.usage
