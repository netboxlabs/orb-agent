# https://mibs.observium.org/mib/HP-ICF-OID/
# https://mibs.observium.org/mib/STATISTICS-MIB/
# https://mibs.observium.org/mib/NETSWITCH-MIB/
# https://mibs.observium.org/mib/HP-ICF-CHASSIS/
---

extends:
  - system-mib.yml
  - if-mib.yml

provider: kentik-switch

sysobjectid:
  - 1.3.6.1.4.1.11.2.3.7.11.*    # Covers a wide range of both HP and Aruba switches

metrics:
  # The CPU utilization in percent(%)
  - MIB: STATISTICS-MIB
    symbol:
      name: hpSwitchCpuStat
      OID: 1.3.6.1.4.1.11.2.14.11.5.1.9.6.1.0
      poll_time_sec: 60
      tag: CPU
  # A table that contains information on all the local memory for each slot
  - MIB: NETSWITCH-MIB
    table:
      name: hpLocalMemTable
      OID: 1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1
    symbols:
      # The number of currently installed bytes
      - name: hpLocalMemTotalBytes
        OID: 1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.5
        poll_time_sec: 60
        tag: MemoryTotal
      # The number of available (unallocated) bytes
      - name: hpLocalMemFreeBytes
        OID: 1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.6
        poll_time_sec: 60
        tag: MemoryFree
  # Chassis sensors (fan/temp/PSU status) — INDEX hpicfSensorIndex
  - MIB: HP-ICF-CHASSIS
    table:
      name: hpicfSensorTable
      OID: 1.3.6.1.4.1.11.2.14.11.1.2.6
    symbols:
      - name: hpicfSensorStatus
        OID: 1.3.6.1.4.1.11.2.14.11.1.2.6.1.4
        enum:
          unknown: 1
          bad: 2
          warning: 3
          good: 4
          notPresent: 5
    metric_tags:
      - column:
          name: hpicfSensorDescr
          OID: 1.3.6.1.4.1.11.2.14.11.1.2.6.1.7
        tag: sensor_name
      - column:
          name: hpicfSensorNumber
          OID: 1.3.6.1.4.1.11.2.14.11.1.2.6.1.3
        tag: sensor_number
