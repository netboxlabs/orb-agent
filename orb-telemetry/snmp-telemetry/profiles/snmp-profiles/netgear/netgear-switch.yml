# https://github.com/librenms/librenms/blob/master/mibs/netgear/NETGEAR-SWITCHING-MIB
# https://mibs.observium.org/mib/NETGEAR-BOXSERVICES-PRIVATE-MIB/
---

extends:
  - system-mib.yml
  - if-mib.yml

sysobjectid:
  - 1.3.6.1.4.1.4526.100.1.28    # M4300-12X12F ProSAFE 12-port
  - 1.3.6.1.4.1.4526.100.1.31    # M4300-52G ProSAFE 48-port

provider: kentik-switch

metrics:
  # The total memory free for utilization in KBytes.
  - MIB: NETGEAR-SWITCHING-MIB
    symbol:
      name: agentSwitchCpuProcessMemFree
      OID: 1.3.6.1.4.1.4526.10.1.1.4.1.0
      poll_time_sec: 60
      tag: MemoryFree
  # The total memory available in KBytes.
  - MIB: NETGEAR-SWITCHING-MIB
    symbol:
      name: agentSwitchCpuProcessMemAvailable
      OID: 1.3.6.1.4.1.4526.10.1.1.4.2.0
      poll_time_sec: 60
      tag: MemoryTotal
  # Total CPU utilization over a period of 5, 60, 300 seconds.
  - MIB: NETGEAR-SWITCHING-MIB
    symbol:
      name: agentSwitchCpuProcessTotalUtilization
      OID: 1.3.6.1.4.1.4526.10.1.1.4.9.0
      poll_time_sec: 60
      tag: CPU
      conversion: "regexp:60 Secs.*?(\\d+)"
  # Chassis fans — INDEX boxServicesFansIndex
  - MIB: NETGEAR-BOXSERVICES-PRIVATE-MIB
    table:
      name: boxServicesFansTable
      OID: 1.3.6.1.4.1.4526.10.43.1.6
    symbols:
      - name: boxServicesFanItemState
        OID: 1.3.6.1.4.1.4526.10.43.1.6.1.3
        enum:
          notpresent: 1
          operational: 2
          failed: 3
          powering: 4
          nopower: 5
          notpowering: 6
          incompatible: 7
    metric_tags:
      - column:
          name: boxServicesFansIndex
          OID: 1.3.6.1.4.1.4526.10.43.1.6.1.1
        tag: fan_index
      - column:
          name: boxServicesFanUnitIndex
          OID: 1.3.6.1.4.1.4526.10.43.1.6.1.6
        tag: unit_index
  # Chassis power supplies — INDEX boxServicesPowSupplyIndex
  - MIB: NETGEAR-BOXSERVICES-PRIVATE-MIB
    table:
      name: boxServicesPowSuppliesTable
      OID: 1.3.6.1.4.1.4526.10.43.1.7
    symbols:
      - name: boxServicesPowSupplyItemState
        OID: 1.3.6.1.4.1.4526.10.43.1.7.1.3
        enum:
          notpresent: 1
          operational: 2
          failed: 3
          powering: 4
          nopower: 5
          notpowering: 6
          incompatible: 7
    metric_tags:
      - column:
          name: boxServicesPowSupplyIndex
          OID: 1.3.6.1.4.1.4526.10.43.1.7.1.1
        tag: psu_index
      - column:
          name: boxServicesPowerSuppUnitIndex
          OID: 1.3.6.1.4.1.4526.10.43.1.7.1.4
        tag: unit_index
  # Chassis temperature — INDEX boxServicesUnitIndex, boxServicesTempSensorIndex
  - MIB: NETGEAR-BOXSERVICES-PRIVATE-MIB
    table:
      name: boxServicesTempSensorsTable
      OID: 1.3.6.1.4.1.4526.10.43.1.8
    symbols:
      - name: boxServicesTempSensorState
        OID: 1.3.6.1.4.1.4526.10.43.1.8.1.4
        enum:
          low: 0
          normal: 1
          warning: 2
          critical: 3
          shutdown: 4
          notpresent: 5
          notoperational: 6
      - name: boxServicesTempSensorTemperature
        OID: 1.3.6.1.4.1.4526.10.43.1.8.1.5
        tag: Temperature
    metric_tags:
      - column:
          name: boxServicesUnitIndex
          OID: 1.3.6.1.4.1.4526.10.43.1.8.1.1
        tag: unit_index
      - column:
          name: boxServicesTempSensorIndex
          OID: 1.3.6.1.4.1.4526.10.43.1.8.1.2
        tag: temp_index
metric_tags:
  # The switch's Machine Model.
  - column:
      name: agentInventoryMachineModel
      OID: 1.3.6.1.4.1.4526.10.1.1.1.3.0
  # Lists the version of software loaded on this unit.
  - column:
      name: agentInventorySoftwareVersion
      OID: 1.3.6.1.4.1.4526.10.1.1.1.13.0
